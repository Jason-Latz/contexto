<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Contexto overnight run summary: Spanish rendered-band accuracy 90.4 percent, German 71.3 percent; 9 commits, 118 tests passing, 223 pack fixes applied.">
  <style>
    :root {
      --bg: #ffffff; --panel: #f6f7f9; --ink: #1a1d21; --muted: #6b7280;
      --grid: #e3e6ea; --good: #2f9e6f; --warn: #d6963b; --accent: #3b6fb0; --track: #e8ebef;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171b; --panel: #1c2027; --ink: #eef1f4; --muted: #9aa3ad;
        --grid: #2a2f37; --good: #43b98a; --warn: #e0a851; --accent: #6ea8e6; --track: #262b33; }
    }
    :root[data-theme="light"] { --bg:#ffffff; --panel:#f6f7f9; --ink:#1a1d21; --muted:#6b7280; --grid:#e3e6ea; --good:#2f9e6f; --warn:#d6963b; --accent:#3b6fb0; --track:#e8ebef; }
    :root[data-theme="dark"] { --bg:#14171b; --panel:#1c2027; --ink:#eef1f4; --muted:#9aa3ad; --grid:#2a2f37; --good:#43b98a; --warn:#e0a851; --accent:#6ea8e6; --track:#262b33; }
    .title { fill: var(--ink); font-size: 26px; font-weight: 700; }
    .sub { fill: var(--muted); font-size: 14px; }
    .h { fill: var(--ink); font-size: 15px; font-weight: 600; }
    .lab { fill: var(--ink); font-size: 15px; font-weight: 600; }
    .pct { fill: var(--ink); font-size: 15px; font-weight: 700; }
    .tick { fill: var(--muted); font-size: 11px; }
    .tileN { fill: var(--ink); font-size: 26px; font-weight: 700; }
    .tileL { fill: var(--muted); font-size: 12px; }
    .note { fill: var(--muted); font-size: 12px; }
  </style>

  <rect x="0" y="0" width="900" height="580" fill="var(--bg)"/>
  <text x="40" y="52" class="title">Contexto — overnight core-loop run</text>
  <text x="40" y="76" class="sub">2026-07-07 · simpler passive immersion + higher-fidelity click-to-learn · branch overnight/core-loop-fidelity</text>
  <line x1="40" y1="96" x2="860" y2="96" stroke="var(--grid)" stroke-width="1"/>

  <!-- Accuracy section -->
  <text x="40" y="132" class="h">Rendered-band translation accuracy (adversarial audit, double-skeptic confirmed)</text>

  <text x="40" y="150" class="tick">es = FreeDict (solid) · de/fr/it = Wiktextract-inverted (shared wrong-sense problem)</text>

  <!-- scale grid 0..100 over track x=250..810 -->
  <g>
    <line x1="250" y1="160" x2="250" y2="304" stroke="var(--grid)" stroke-width="1"/>
    <line x1="390" y1="160" x2="390" y2="304" stroke="var(--grid)" stroke-width="1"/>
    <line x1="530" y1="160" x2="530" y2="304" stroke="var(--grid)" stroke-width="1"/>
    <line x1="670" y1="160" x2="670" y2="304" stroke="var(--grid)" stroke-width="1"/>
    <line x1="810" y1="160" x2="810" y2="304" stroke="var(--grid)" stroke-width="1"/>
  </g>

  <!-- Spanish 90.4% -> 506 -->
  <text x="40" y="182" class="lab">Spanish</text>
  <text x="40" y="198" class="tick">51 fixed · deeper slice 100%</text>
  <rect x="250" y="166" width="560" height="26" rx="5" fill="var(--track)"/>
  <rect x="250" y="166" width="506" height="26" rx="5" fill="var(--good)"/>
  <text x="766" y="184" class="pct">90.4%</text>

  <!-- German 71.3% -> 399 -->
  <text x="40" y="218" class="lab">German</text>
  <text x="40" y="234" class="tick">214 fixed · slice 2: 86.9%</text>
  <rect x="250" y="202" width="560" height="26" rx="5" fill="var(--track)"/>
  <rect x="250" y="202" width="399" height="26" rx="5" fill="var(--warn)"/>
  <text x="659" y="220" class="pct">71.3%</text>

  <!-- French 84.8% -> 475 (first audit) -->
  <text x="40" y="254" class="lab">French</text>
  <text x="40" y="270" class="tick">61 fixed · first audit</text>
  <rect x="250" y="238" width="560" height="26" rx="5" fill="var(--track)"/>
  <rect x="250" y="238" width="475" height="26" rx="5" fill="var(--warn)"/>
  <text x="735" y="256" class="pct">84.8%</text>

  <!-- Italian 84.5% -> 473 (first audit) -->
  <text x="40" y="290" class="lab">Italian</text>
  <text x="40" y="306" class="tick">62 fixed · first audit</text>
  <rect x="250" y="274" width="560" height="26" rx="5" fill="var(--track)"/>
  <rect x="250" y="274" width="473" height="26" rx="5" fill="var(--warn)"/>
  <text x="733" y="292" class="pct">84.5%</text>

  <!-- 95% target marker -->
  <line x1="782" y1="164" x2="782" y2="300" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="788" y="174" class="tick">95%</text>

  <!-- scale labels -->
  <text x="250" y="322" class="tick" text-anchor="middle">0</text>
  <text x="390" y="322" class="tick" text-anchor="middle">25</text>
  <text x="530" y="322" class="tick" text-anchor="middle">50</text>
  <text x="670" y="322" class="tick" text-anchor="middle">75</text>
  <text x="810" y="322" class="tick" text-anchor="middle">100%</text>

  <!-- Stats tiles -->
  <g>
    <rect x="40" y="368" width="190" height="86" rx="10" fill="var(--panel)"/>
    <text x="60" y="410" class="tileN">14</text>
    <text x="60" y="434" class="tileL">commits landed on main</text>

    <rect x="246" y="368" width="190" height="86" rx="10" fill="var(--panel)"/>
    <text x="266" y="410" class="tileN">119 <tspan class="tileL">TS</tspan></text>
    <text x="266" y="434" class="tileL">tests green (+32 python)</text>

    <rect x="452" y="368" width="190" height="86" rx="10" fill="var(--panel)"/>
    <text x="472" y="410" class="tileN">388</text>
    <text x="472" y="434" class="tileL">pack errors fixed / gated</text>

    <rect x="658" y="368" width="202" height="86" rx="10" fill="var(--panel)"/>
    <text x="678" y="410" class="tileN">178</text>
    <text x="678" y="434" class="tileL">agents (impl · review · audit)</text>
  </g>

  <!-- What shipped -->
  <line x1="40" y1="482" x2="860" y2="482" stroke="var(--grid)" stroke-width="1"/>
  <text x="40" y="510" class="h">Shipped</text>
  <text x="40" y="534" class="note">Both pretests removed · silent first-run · 6 sabotage-verified simulation tests · hover card teaches gender/article/plural.</text>
  <text x="40" y="552" class="note">Popup gloss cleaning + identical-cognate injection filter (~1994 non-noun target==source matches gated, French heaviest).</text>
  <text x="40" y="570" class="note">Open follow-up: de/fr/it all need a sense-ranked re-import — this run patched only the sampled slices (~390 fixes).</text>
</svg>
